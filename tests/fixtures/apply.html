<!doctype html><html><head><title>Apply - Initech</title></head><body>
<main><h1>ML Engineer</h1><p>Initech is hiring an ML Engineer in Buenos Aires to train and ship ranking models.
You will work with Python, PyTorch and SQL with a small product team; hybrid, three days in the office.</p></main>
<form onsubmit="window.__submitted = true; return false">
  <label for="fn">First name *</label><input id="fn" autocomplete="given-name">
  <label for="ln">Last name</label><input id="ln">
  <label for="em">Email address</label><input id="em" type="email" value="prefilled@example.com">
  <label for="ph">Phone number</label><input id="ph" type="tel">
  <label for="li">LinkedIn profile</label><input id="li" type="url">
  <label for="cty">Country</label>
  <select id="cty"><option value="">Select…</option><option value="ar">Argentina</option><option value="br">Brazil</option></select>
  <label for="np">Notice period</label>
  <select id="np"><option value="">Select…</option><option>Immediately</option><option>2 weeks</option><option>1 month</option></select>
  <fieldset><legend>Do you require visa sponsorship?</legend>
    <label><input type="radio" name="visa" value="y"> Yes</label><label><input type="radio" name="visa" value="n"> No</label>
  </fieldset>
  <label for="yrs">Years of PyTorch experience</label><input id="yrs" type="number">
  <label for="sal">Expected salary (USD / month)</label><input id="sal">
  <label for="why">Why do you want to work at Initech?</label><textarea id="why"></textarea>
  <label><input type="checkbox" id="terms"> I agree to the privacy policy</label>
  <label for="loc">Location (city)</label>
  <input id="loc" role="combobox" aria-autocomplete="list" aria-controls="loc-list">
  <ul id="loc-list" role="listbox"><li role="option">Buenos Aires</li><li role="option">Bogotá</li></ul>
  <script>
    for (const o of document.querySelectorAll("#loc-list li"))
      o.addEventListener("mousedown", () => { document.querySelector("#loc").value = o.textContent; window.__picked = o.textContent; });
  </script>
  <label for="cv">Resume/CV</label><input id="cv" type="file" accept=".pdf">
  <label for="cl">Cover letter</label><input id="cl" type="file">
  <button type="submit" onclick="window.__clicked = true">Submit application</button>
</form></body></html>
