<!doctype html><html><head><style>.vh{position:absolute;opacity:0;width:1px;height:1px}</style></head><body><form>
<fieldset><legend>Do you require visa sponsorship? *</legend>
  <label><input type="radio" name="visa" value="y"> Yes</label>
  <label><input type="radio" name="visa" value="n" checked> No</label>
</fieldset>
<p>Are you willing to relocate?</p>
<input class="vh" type="radio" id="r1" name="reloc"><label for="r1">Yes</label>
<input class="vh" type="radio" id="r2" name="reloc"><label for="r2">No</label>
<div role="radiogroup" aria-label="Work arrangement">
  <div role="radio" aria-checked="false" tabindex="0">Remote</div>
  <div role="radio" aria-checked="true" tabindex="0">Hybrid</div>
</div>
<fieldset><legend>Which languages do you speak?</legend>
  <label><input type="checkbox" name="lang" checked> English</label>
  <label><input type="checkbox" name="lang"> German</label>
</fieldset>
</form></body></html>
